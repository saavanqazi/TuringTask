[metadata]
scenario_name = "the meetings still waiting on a yes"
scenario_description = "=== INTENT ===\nInvitation follow-up on the outlook gym: of the meetings the acting user organised in a three-week window, which are still\nwaiting on a proper answer from a required attendee, reading answers from both the invitation and his mail, who owes one, and has\nthat person written to him before. Ends in one draft per person, placed on their own latest email. Mined from seed\ne9ccc5d8-a2dd-4a56-ad19-29d70593e96a (outlook, inbox-triage-summarization), where the client asked which of their emails still needed a\nresponse. Kept: the who-still-owes-an-answer judgement and staging the follow-up rather than sending it. Dropped: the seed's own inbox.\nHardened (trainer, 2026-09-30, three rounds): answers by email count and the latest one wins; an answer given before a meeting was\nmoved no longer counts; every day and time people write is Pacific, while the tools show timestamps in UTC. Seven inbox messages and\nthe moves of two meetings are seeded at build time.\n\n=== CONNECTOR ===\noutlook-gym on container port 8014. Acting user Jack Spencer (id 46, jack.spencer@contoso.example), authenticated by his users.api_key\nthrough header x-outlook-user-token. Tools: search_calendar, search_email, draft_email.\n\n=== HOPS ===\nhops=7 chain_depth=3 over 8 steps.\n  search_calendar  1   (root - the range is stated in the prompt; move notes and UTC response times come with it)\n  search_email     4   (one per candidate from the calendar; each address comes from the attendee list)\n  draft_email      3   (recipient from the calendar read, parent message = that person's latest email from their mail read)\n  Longest path: read_calendar -> mail_from_charlotte_palmer -> draft_charlotte_palmer = 3.\n\n=== HIDDEN RULES ===\n(the prompt states every rule; the agent must connect them to the data)\n  - TIMESTAMPS ARE UTC, PEOPLE WRITE PACIFIC. Attendee response times and email times come back as ...Z; the move notes, \"tomorrow\"\n    and the instruction are Pacific (PDT, UTC-7). Every before/after below is the same under UTC-7 or UTC-8; it flips only if the UTC\n    clock time is read as if it were Pacific.\n  - OKR PLANNING was moved on 28 April at 11:00 Pacific (lastModifiedDateTime 2026-04-28T18:00Z). Jack Henry accepted at 17:40Z\n    (10:40 Pacific) and Diego Alvarez emailed \"count me in for tomorrow's planning session\" at 17:52Z (10:52 Pacific, \"tomorrow\" =\n    Wednesday, the old slot): both before the move, so neither counts. The eugene.dunn acceptances at 19:20Z/19:35Z are after it.\n  - WEEKLY PIPELINE REVIEW (6 May) was moved on 1 May at 16:00 Pacific (2026-05-01T23:00Z). Diego accepted at 22:30Z (15:30 Pacific):\n    before the move, so he owes it. Jenna White, Jared Ellis and the kenneth.hall row accepted after it.\n  - THE LATEST EMAIL WINS. Charlotte Palmer wrote \"won't be able to make Friday's learning session\" (29 April) and then, at\n    2026-05-01T04:30Z = Thursday 30 April 21:30 Pacific, \"maybe I can make tomorrow's learning session after all\": tomorrow is Friday,\n    Learning Time, and it is a maybe, so she still owes it. Read by the UTC date, \"tomorrow\" would be Saturday.\n    Jack Miller wrote \"I'll try\" (29 April) and then \"count me in for the feature brainstorm on Friday\" (30 April): answered.\n  - A MAYBE IS NOT AN ANSWER. Diego Alvarez is \"still not sure about the feature brainstorm on Friday\".\n  - MOST RECENT EMAIL MEANS MOST RECENT OF ANY SUBJECT. Charlotte's latest email to him is the 21 May Privacy Impact Assessments\n    reply; Jack Henry's only email is about the component library.\n  - DECLINED IS AN ANSWER EITHER WAY. Jared Ellis declined Weekly Pipeline Review (2 May) and then emailed that he can make it.\n  - HE IS ON HIS OWN ATTENDEE LIST, and six of the eleven events in the window were organised by someone else.\n  - AN UNDATED CALENDAR SEARCH FAILS on this gym; the stated range has to be passed.\n\n=== GOLD ===\n(grader metadata, NOT shown to the agent; derived from the seeded snapshot and re-derived from the oracle replay by\nsolution/verify_gold_from_oracle.py.)\n\n{\n  \"meetings_i_am_running\": 5,\n  \"meetings_still_owed_an_answer\": 4,\n  \"people_to_chase\": 3,\n  \"answers_still_owed\": 5,\n  \"people_to_chase_who_already_emailed_me\": 3\n}\n\n  OKR Planning               2026-04-30  moved 28 Apr 11:00 PT. Diego tentative + pre-move email -> OWES; Jack Henry accepted 10:40 PT -> OWES\n  Learning Time              2026-05-01  Charlotte Palmer notResponded; latest email (Thu 21:30 PT) is a maybe about tomorrow's -> OWES\n  Brainstorm: New Feature    2026-05-01  Diego tentative + \"still not sure\" -> OWES; Jack Miller latest email \"count me in\" -> answered\n  Weekly Pipeline Review     2026-05-02  Jared Ellis declined (answered)\n  Weekly Pipeline Review     2026-05-06  moved 1 May 16:00 PT. Diego accepted 15:30 PT -> OWES; everyone else accepted after the move\n\nWrite-back: drafts to diego.alvarez@contoso.example on CONV2E9B4D17A6C05F83E2B9D1C47A68 (reply to AAMk8B3F6D20E1A94C7B5E0F2A9C6D14, naming\nOKR Planning, Brainstorm and the Weekly Pipeline Review), jack.henry@contoso.example on CONVFC26D0917EF2FCC2CD5F81D82832 (reply to\nAAMkDDFB4210A30B7656D7D0057D2820, naming OKR Planning) and charlotte.palmer@contoso.example on CONV4E78FC18AA9735C68D58FD530005 (reply to\nAAMkD61867BD0A78844C3815861A41BA, naming Learning Time). Seed: no drafts, 2 sent messages from him.\n\n=== DECOYS ===\n  UTC timestamps read as Pacific clock times        -> 5/1/1/1/1 (Diego only, for the brainstorm)\n  ignore both moves                                 -> 5/2/2/2/2\n  ignore only the 6 May move                        -> 5/3/3/4/3, Diego's draft without the pipeline review\n  Charlotte's \"tomorrow\" by the UTC date            -> 5/3/2/4/2 (Charlotte answered by her first email)\n  ignore the email answers                          -> Jack Miller kept: 4 people, 6 answers\n  write-back\n      Charlotte's draft on her Learning Time thread instead of her latest email   -> thread row 0\n      a new message to Jack Henry instead of a reply                              -> thread row 0\n      a draft to Jack Miller                                                      -> 4 recipients\n      send instead of draft                                                       -> sent count > 2\n\n=== SEED ===\ne9ccc5d8-a2dd-4a56-ad19-29d70593e96a (outlook, inbox-triage-summarization), drawn from 12_trajectories_mask_pii.jsonl.\nBuild-time seed environment/seed/seed_outlook_task.py adds seven inbox messages for user 46 to Synthetic_db.db (Jack Miller x3,\nCharlotte Palmer x2, Diego Alvarez, Jared Ellis), marks OKR Planning and the 6 May Weekly Pipeline Review as moved with UTC response\ntimes either side of each move, and fails the build on drift or collision.\n"

source_task_id = "e9ccc5d8-a2dd-4a56-ad19-29d70593e96a"
domain = "Productivity & Collaboration"
subdomain = "meeting follow-up"
state_snapshot_enabled = false
# metadata.agent left unset: setting it to "oracle" lets test_outputs.py score
