[[metadata.mcp_servers_extended]]
name = "outlook-gym"
image = "us-central1-docker.pkg.dev/delivery-g-obi/connectors-rl-gym/connectors-harness@sha256:b1374cd8a392ea66f9a649e700a1498e8fcb03ee35776362db7cc15dc3049b89"
host_port = 8014
container_port = 8014
remote_url_env = "OUTLOOK_GYM_MCP_REMOTE_URL"
auth_header_name = "x-outlook-user-token"
access_token = "c776aa4f208079cef19594d00c80557e6a17f0cdd8b0e5977aab2c688085bca7"
db_id_header_name = "x-database-id"
reset_on_run = true

[verifier]
timeout_sec = 1500.0

[agent]
timeout_sec = 4800.0
# Non-root agent user; /app is root-only so the agent can't read
# task.toml/solution/tests off disk.
user = "rlgymagent"

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 65536
gpus = 0
allow_internet = true

[[environment.mcp_servers]]
name = "outlook-gym"
transport = "streamable-http"
url = "http://localhost:7000/mcp/outlook-gym"
args = []

[metadata.verifier_judge]
# JUDGE_MODEL can override the default without editing the generated package.
# Do not hardcode a model id here: different deployments resolve different ids.
model = "${JUDGE_MODEL:-openai/zai-org/GLM-5.2}"
api_key_env = "OPENAI_API_KEY"
temperature = 0.0
max_tokens = 65536

[verifier.env]
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
OPENAI_BASE_URL = "${OPENAI_BASE_URL:-}"
JUDGE_MODEL = "${JUDGE_MODEL:-openai/zai-org/GLM-5.2}"

[environment.healthcheck]
command = "curl -fsS --max-time 3 http://localhost:7000/health"
interval_sec = 15.0
timeout_sec = 120.0
retries = 150
start_period_sec = 30.0
start_interval_sec = 15.0

[environment.env]
HARBOR_MCP_MODE = "${HARBOR_MCP_MODE:-docker}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"
GEMINI_API_KEY = "${GEMINI_API_KEY:-}"
OUTLOOK_GYM_MCP_REMOTE_URL = "${OUTLOOK_GYM_MCP_REMOTE_URL:-}"
OUTLOOK_GYM_MCP_REMOTE_URL_TOKEN = "${OUTLOOK_GYM_MCP_REMOTE_URL_TOKEN:-}"
