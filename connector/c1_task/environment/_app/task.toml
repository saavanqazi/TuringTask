[metadata]
scenario_name = "the meetings still waiting on a yes"
scenario_description = "=== INTENT ===\nRSVP reconciliation on the outlook gym: for every meeting the acting user organised in a three-week window, where each required\nattendee stands, reading answers from both the invitation and his mail; a ledger of every attendee, the entries of his assistant's\nRSVP tracker that are wrong, and one draft per person who still owes an answer, placed on their own latest email. Mined from seed\ne9ccc5d8-a2dd-4a56-ad19-29d70593e96a (outlook, inbox-triage-summarization), where the client asked which of their emails still needed a\nresponse. Kept: the who-still-owes-an-answer judgement and staging the follow-up rather than sending it. Dropped: the seed's own inbox.\nHardened (trainer, 2026-09-30 to 10-01, five rounds): answers by email count and the last answer on either channel wins; an answer\ngiven before a meeting was moved no longer counts; a tentative, a maybe or a conditional yes is not an answer; sending someone in your\nplace is a no; only a person's own answer counts; days and times people write are Pacific, while the tools show UTC; a cancelled\nmeeting is out; people are their addresses, not their display names. Deliverables are exact lists (15 ledger rows, 8 tracker fixes),\nnot counts. Fourteen inbox messages, two moves, answer times on five meetings and one cancelled meeting are seeded at build time.\n\n=== CONNECTOR ===\noutlook-gym on container port 8014. Acting user Jack Spencer (id 46, jack.spencer@contoso.example), authenticated by his users.api_key\nthrough header x-outlook-user-token. Tools: search_calendar, search_email, draft_email.\n\n=== HOPS ===\nhops=6 chain_depth=3 over 5 steps.\n  search_calendar  1   (root - the range is stated in the prompt; isCancelled, move notes, attendee types and UTC response times come with it)\n  search_email     1   (the whole mailbox: emailed answers, relayed notes, Janice's tracker, each person's latest email)\n  draft_email      3   (recipient from the two reads together, parent message = that person's latest email)\n  Longest path: read_calendar -> read_mailbox -> draft_charlotte_palmer = 3.\n\n=== HIDDEN RULES ===\n(the prompt states every rule; the agent must connect them to the data)\n  - TIMESTAMPS ARE UTC, PEOPLE WRITE PACIFIC. Response and email times come back as ...Z; the move notes, \"tomorrow\", \"Saturday\",\n    \"Wednesday\" and the instruction are Pacific (PDT, UTC-7). Every before/after is the same under UTC-7 or UTC-8; it flips only if the\n    UTC clock time is read as if it were Pacific.\n  - MOVES. OKR Planning moved 28 April 11:00 Pacific (18:00Z): Jack Henry's acceptance (17:40Z) and Diego's tentative (27 April) and\n    emailed yes for \"tomorrow's planning session\" (17:52Z) predate it. The 6 May Weekly Pipeline Review moved 1 May 16:00 Pacific\n    (23:00Z): Diego's acceptance (22:30Z) predates it.\n  - THE LAST ANSWER ON EITHER CHANNEL WINS. Jasmine Porter emailed \"count me in for Saturday's pipeline review\" (30 April 18:34Z) and\n    then declined the 2 May invitation (1 May 20:00Z): NOT_COMING,INVITATION. Jared Ellis declined it (29 April 23:00Z) and then emailed\n    that he can make it (30 April 15:20Z): COMING,EMAIL. Jack Miller: tentative, \"I'll try\", then \"count me in\": COMING,EMAIL.\n    Charlotte: \"won't be able to make Friday's learning session\", then \"maybe I can make tomorrow's learning session after all\"\n    (Thursday 21:30 Pacific): OWES_ANSWER.\n  - A CONDITIONAL YES IS NOT AN ANSWER. Diego (4 May): Wednesday's pipeline review \"works for me as long as the forecast numbers are in\n    by Tuesday night. I'll confirm once they are.\"\n  - SOMEONE IN YOUR PLACE IS A NO, AND IT IS YOUR OWN ANSWER. Jenna White (5 May, after accepting): \"I'm at the customer offsite all day\n    Wednesday, so Kenneth will cover the forecast for me at the pipeline review\": NOT_COMING,EMAIL.\n  - A RELAYED ANSWER IS NOT AN ANSWER. Jasmine Porter for Jack Henry (OKR Planning), Carson Flores for Charlotte (Learning Time), and\n    Janice's tracker itself.\n  - A CANCELLED MEETING IS OUT. Customer Advisory Board prep (12 May, organised by him, isCancelled, \"Cancelled on 4 May\") has Jack\n    Miller and Jenna White unanswered and Charlotte tentative.\n  - PEOPLE ARE ADDRESSES. Five external attendees carry the display name \"Jack Spencer\"; eugene.dunn@pinwheellabs.com is listed twice\n    on OKR Planning (as \"Jack Spencer\" and \"Isla Hughes\"), both after the move.\n  - MOST RECENT EMAIL MEANS MOST RECENT OF ANY SUBJECT: Diego 12 May \"Q3 roadmap draft\", Charlotte 21 May Privacy Impact Assessments,\n    Jack Henry's component library reply.\n  - AN UNDATED CALENDAR SEARCH FAILS on this gym; the stated range has to be passed.\n\n=== GOLD ===\n(grader metadata, NOT shown to the agent; derived from the seeded snapshot and re-derived from the oracle replay by\nsolution/verify_gold_from_oracle.py.)\n\nrsvp_ledger.csv (meeting,date,attendee,status,source), 15 rows:\n  OKR Planning,2026-04-30,diego.alvarez@contoso.example,OWES_ANSWER,NONE\n  OKR Planning,2026-04-30,jack.henry@contoso.example,OWES_ANSWER,NONE\n  OKR Planning,2026-04-30,eugene.dunn@pinwheellabs.com,COMING,INVITATION\n  Learning Time,2026-05-01,charlotte.palmer@contoso.example,OWES_ANSWER,NONE\n  Learning Time,2026-05-01,edward.clark@forgeco.com,COMING,INVITATION\n  Brainstorm: New Feature,2026-05-01,diego.alvarez@contoso.example,OWES_ANSWER,NONE\n  Brainstorm: New Feature,2026-05-01,jack.miller@contoso.example,COMING,EMAIL\n  Brainstorm: New Feature,2026-05-01,rogers.catherine@protonmail.com,COMING,INVITATION\n  Weekly Pipeline Review,2026-05-02,jasmine.porter@contoso.example,NOT_COMING,INVITATION\n  Weekly Pipeline Review,2026-05-02,jared.ellis@contoso.example,COMING,EMAIL\n  Weekly Pipeline Review,2026-05-02,ava.lopez@lumendata.com,COMING,INVITATION\n  Weekly Pipeline Review,2026-05-06,diego.alvarez@contoso.example,OWES_ANSWER,NONE\n  Weekly Pipeline Review,2026-05-06,jenna.white@contoso.example,NOT_COMING,EMAIL\n  Weekly Pipeline Review,2026-05-06,jared.ellis@contoso.example,COMING,INVITATION\n  Weekly Pipeline Review,2026-05-06,kenneth.hall@pemberleybank.com,COMING,INVITATION\n\ntracker_fixes.csv (meeting,date,attendee,tracker_status,status), 8 rows:\n  OKR Planning,2026-04-30,diego.alvarez@contoso.example,COMING,OWES_ANSWER\n  OKR Planning,2026-04-30,jack.henry@contoso.example,COMING,OWES_ANSWER\n  Learning Time,2026-05-01,charlotte.palmer@contoso.example,COMING,OWES_ANSWER\n  Brainstorm: New Feature,2026-05-01,jack.miller@contoso.example,OWES_ANSWER,COMING\n  Weekly Pipeline Review,2026-05-02,jasmine.porter@contoso.example,COMING,NOT_COMING\n  Weekly Pipeline Review,2026-05-02,jared.ellis@contoso.example,NOT_COMING,COMING\n  Weekly Pipeline Review,2026-05-06,diego.alvarez@contoso.example,COMING,OWES_ANSWER\n  Weekly Pipeline Review,2026-05-06,jenna.white@contoso.example,COMING,NOT_COMING\nAgreeing entries left out: eugene.dunn on OKR Planning, Diego on the brainstorm, Jared on 6 May. Off-ledger entries left out: Jack Henry\non the brainstorm (optional), Jack Miller on Customer Advisory Board prep (cancelled).\n\nWrite-back: drafts to diego.alvarez@contoso.example on CONV3F9C6A18E2B57D04F7A3C9E16B58 (reply to AAMkB7F3E1A92C6D58B0F4A7E3C9D261, naming\nOKR Planning, Brainstorm and the Weekly Pipeline Review), jack.henry@contoso.example on CONVFC26D0917EF2FCC2CD5F81D82832 (reply to\nAAMkDDFB4210A30B7656D7D0057D2820, naming OKR Planning) and charlotte.palmer@contoso.example on CONV4E78FC18AA9735C68D58FD530005 (reply to\nAAMkD61867BD0A78844C3815861A41BA, naming Learning Time). Seed: no drafts, 2 sent messages from him.\n\n=== DECOYS ===\n  email always overrides the invitation (h4 rule)   -> Jasmine COMING,EMAIL; tracker fix row for Jasmine lost\n  invitation only                                    -> Jared NOT_COMING,INVITATION; Jack Miller OWES_ANSWER\n  conditional yes counted                            -> Diego 6 May COMING,EMAIL\n  stand-in note read as relayed                      -> Jenna OWES_ANSWER,NONE and a fourth draft to her\n  missing Jenna's email (only chased people's mail)  -> Jenna COMING,INVITATION\n  relayed answers counted                            -> Jack Henry and/or Charlotte COMING,EMAIL\n  UTC read as Pacific                                -> Diego OKR COMING,EMAIL\n  cancelled meeting kept                             -> +3 ledger rows; drafts to Jack Miller and Jenna White\n  optional attendees kept                            -> +4 ledger rows\n  \"Jack Spencer\" display names dropped as \"me\"       -> -5 ledger rows\n  eugene.dunn written twice                          -> 16 ledger rows\n  tracker taken at face value / every entry listed   -> wrong ledger rows / 13 fix rows\n  write-back\n      Charlotte's draft on her Learning Time thread instead of her latest email   -> thread row 0\n      Diego's draft on 'This week' or 'Wednesday' instead of his 12 May email      -> thread row 0\n      a new message to Jack Henry instead of a reply                              -> thread row 0\n      send instead of draft                                                       -> sent count > 2\n\n=== SEED ===\ne9ccc5d8-a2dd-4a56-ad19-29d70593e96a (outlook, inbox-triage-summarization), drawn from 12_trajectories_mask_pii.jsonl.\nBuild-time seed environment/seed/seed_outlook_task.py adds fourteen inbox messages for user 46 to Synthetic_db.db (Jack Miller x3,\nDiego Alvarez x3, Charlotte Palmer x2, Jasmine Porter x2, Jared Ellis, Jenna White, Carson Flores, Janice Gray), marks OKR Planning and\nthe 6 May Weekly Pipeline Review as moved, sets UTC answer times on all five meetings (and Jasmine Porter's decline of 2 May), adds the\ncancelled Customer Advisory Board prep, and fails the build on drift or collision.\n"

