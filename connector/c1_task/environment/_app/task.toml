[metadata]
scenario_name = "the meetings still waiting on a yes"
scenario_description = "=== INTENT ===\nRSVP reconciliation on the outlook gym: for every meeting the acting user organised that starts in a three-week window (Pacific),\nwhere each required attendee stands, reading answers from both the invitation and his mail; a ledger of every attendee, the entries\nof his assistant's RSVP tracker that are wrong, and one draft per person who still owes an answer, placed on their own latest email.\nMined from seed e9ccc5d8-a2dd-4a56-ad19-29d70593e96a (outlook, inbox-triage-summarization), where the client asked which of their\nemails still needed a response. Kept: the who-still-owes-an-answer judgement and staging the follow-up rather than sending it.\nHardened (trainer, 2026-09-30 to 10-01, six rounds). The rules are all stated; the difficulty is in reading the data: nine meetings\nand 31 ledger rows; answers that only resolve across two messages (a conditional yes settled by someone else's note, judged in\nPacific time); a reply whose own words reverse the yes quoted beneath it; a meeting referred to only by its day and time; window\nedges that differ between Pacific and UTC; a mailbox larger than one default page; seven drafts, each on a different latest email.\n\n=== CONNECTOR ===\noutlook-gym on container port 8014. Acting user Jack Spencer (id 46, jack.spencer@contoso.example), authenticated by his users.api_key\nthrough header x-outlook-user-token. Tools: search_calendar, search_email, draft_email.\n\n=== HOPS ===\nhops=10 chain_depth=3 over 9 steps.\n  search_calendar  1   (root - Pacific range; isCancelled, move notes, attendee types and UTC response times)\n  search_email     1   (the whole mailbox, 32 messages, more than the 25-message default page)\n  draft_email      7   (recipient from the two reads together, parent message = that person's latest email)\n\n=== HIDDEN RULES ===\n(the prompt states every rule; the agent must connect them to the data)\n  - TIMESTAMPS ARE UTC, PEOPLE WRITE PACIFIC (PDT, UTC-7).\n  - WINDOW EDGES. Customer Escalation Sync starts Sun 17 May 17:30 Pacific = 18 May 00:30Z: in. Planning Offsite Prep starts Sun 26 Apr\n    21:00 Pacific = 27 Apr 04:00Z: out. A UTC-bounded search or a UTC date gets both wrong.\n  - MOVES. OKR Planning moved 28 Apr 11:00 Pacific (18:00Z); the 6 May Weekly Pipeline Review moved 1 May 16:00 Pacific (23:00Z).\n    Answers before a move no longer count.\n  - THE LAST ANSWER ON EITHER CHANNEL WINS (Jasmine 2 May, Jared 2 May, Jack Miller brainstorm, Charlotte Learning Time and roadmap\n    review, Cameron debrief, Jack Henry vendor review).\n  - A CONDITIONAL YES COUNTS ONCE ITS CONDITION HAS HAPPENED. Diego (6 May review): \"as long as the forecast numbers are in by Tuesday\n    night\"; Kenneth Hall: \"the forecast numbers are in\" at 2026-05-06T05:40Z = Tue 22:40 Pacific -> COMING,EMAIL. Cameron (roadmap\n    review): \"as long as the board deck is signed off by Friday\"; Nora Ford: \"signed off this evening\" at 2026-05-09T02:35Z = Fri 19:35\n    Pacific -> COMING,EMAIL. Read in UTC both notes fall on the next day.\n  - QUOTED TEXT IS OLDER. Jack Henry's 6 May reply \"Scratch that ... I won't make the vendor review\" sits above his quoted 4 May yes.\n  - INDIRECT REFERENCES. Jasmine: \"I'll be at the 2pm one on Thursday\" (sent Tue 5 May) = Vendor Security Review, Thu 7 May 14:00.\n  - SOMEONE IN YOUR PLACE IS A NO (Jenna, 6 May; Jack Henry also names Jasmine to cover the vendor review).\n  - A RELAYED ANSWER IS NOT AN ANSWER (Jasmine for Jack Henry, Carson for Charlotte, Janice's tracker).\n  - CANCELLED MEETING OUT (Customer Advisory Board prep). PEOPLE ARE ADDRESSES (six external attendees shown as \"Jack Spencer\";\n    eugene.dunn listed twice on OKR Planning).\n  - MOST RECENT EMAIL OF ANY SUBJECT: Olivia's is a 1 April onboarding risk-log note; Nora's is her 8 May (UTC 9 May) board deck note.\n  - THE MAILBOX IS 32 MESSAGES; search_email returns 25 by default.\n\n=== GOLD ===\n(grader metadata, NOT shown to the agent; derived from the seeded snapshot and re-derived from the oracle replay by\nsolution/verify_gold_from_oracle.py.)\n\nrsvp_ledger.csv (meeting,date,attendee,status,source), 31 rows:\n  OKR Planning,2026-04-30,diego.alvarez@contoso.example,OWES_ANSWER,NONE\n  OKR Planning,2026-04-30,jack.henry@contoso.example,OWES_ANSWER,NONE\n  OKR Planning,2026-04-30,eugene.dunn@pinwheellabs.com,COMING,INVITATION\n  Learning Time,2026-05-01,charlotte.palmer@contoso.example,OWES_ANSWER,NONE\n  Learning Time,2026-05-01,edward.clark@forgeco.com,COMING,INVITATION\n  Brainstorm: New Feature,2026-05-01,diego.alvarez@contoso.example,OWES_ANSWER,NONE\n  Brainstorm: New Feature,2026-05-01,jack.miller@contoso.example,COMING,EMAIL\n  Brainstorm: New Feature,2026-05-01,rogers.catherine@protonmail.com,COMING,INVITATION\n  Weekly Pipeline Review,2026-05-02,jasmine.porter@contoso.example,NOT_COMING,INVITATION\n  Weekly Pipeline Review,2026-05-02,jared.ellis@contoso.example,COMING,EMAIL\n  Weekly Pipeline Review,2026-05-02,ava.lopez@lumendata.com,COMING,INVITATION\n  Weekly Pipeline Review,2026-05-06,diego.alvarez@contoso.example,COMING,EMAIL\n  Weekly Pipeline Review,2026-05-06,jenna.white@contoso.example,NOT_COMING,EMAIL\n  Weekly Pipeline Review,2026-05-06,jared.ellis@contoso.example,COMING,INVITATION\n  Weekly Pipeline Review,2026-05-06,kenneth.hall@pemberleybank.com,COMING,INVITATION\n  Vendor Security Review,2026-05-07,jack.henry@contoso.example,NOT_COMING,EMAIL\n  Vendor Security Review,2026-05-07,jasmine.porter@contoso.example,COMING,EMAIL\n  Vendor Security Review,2026-05-07,jared.ellis@contoso.example,OWES_ANSWER,NONE\n  Vendor Security Review,2026-05-07,olivia.myers@contoso.example,COMING,INVITATION\n  Q3 Roadmap Review,2026-05-11,diego.alvarez@contoso.example,COMING,INVITATION\n  Q3 Roadmap Review,2026-05-11,charlotte.palmer@contoso.example,COMING,EMAIL\n  Q3 Roadmap Review,2026-05-11,jenna.white@contoso.example,OWES_ANSWER,NONE\n  Q3 Roadmap Review,2026-05-11,nora.ford@contoso.example,COMING,INVITATION\n  Q3 Roadmap Review,2026-05-11,cameron.simpson@contoso.example,COMING,EMAIL\n  Hiring Panel Debrief,2026-05-15,jasmine.porter@contoso.example,COMING,INVITATION\n  Hiring Panel Debrief,2026-05-15,cameron.simpson@contoso.example,COMING,EMAIL\n  Hiring Panel Debrief,2026-05-15,olivia.myers@contoso.example,OWES_ANSWER,NONE\n  Hiring Panel Debrief,2026-05-15,jack.miller@contoso.example,COMING,INVITATION\n  Customer Escalation Sync,2026-05-17,jenna.white@contoso.example,OWES_ANSWER,NONE\n  Customer Escalation Sync,2026-05-17,grace.kelley@pemberleybank.com,COMING,INVITATION\n  Customer Escalation Sync,2026-05-17,nora.ford@contoso.example,OWES_ANSWER,NONE\n\ntracker_fixes.csv (meeting,date,attendee,tracker_status,status), 12 rows:\n  OKR Planning,2026-04-30,diego.alvarez@contoso.example,COMING,OWES_ANSWER\n  OKR Planning,2026-04-30,jack.henry@contoso.example,COMING,OWES_ANSWER\n  Learning Time,2026-05-01,charlotte.palmer@contoso.example,COMING,OWES_ANSWER\n  Brainstorm: New Feature,2026-05-01,jack.miller@contoso.example,OWES_ANSWER,COMING\n  Weekly Pipeline Review,2026-05-02,jasmine.porter@contoso.example,COMING,NOT_COMING\n  Weekly Pipeline Review,2026-05-02,jared.ellis@contoso.example,NOT_COMING,COMING\n  Weekly Pipeline Review,2026-05-06,jenna.white@contoso.example,COMING,NOT_COMING\n  Vendor Security Review,2026-05-07,jack.henry@contoso.example,COMING,NOT_COMING\n  Vendor Security Review,2026-05-07,jasmine.porter@contoso.example,OWES_ANSWER,COMING\n  Q3 Roadmap Review,2026-05-11,charlotte.palmer@contoso.example,NOT_COMING,COMING\n  Q3 Roadmap Review,2026-05-11,cameron.simpson@contoso.example,OWES_ANSWER,COMING\n  Hiring Panel Debrief,2026-05-15,cameron.simpson@contoso.example,NOT_COMING,COMING\nJanice's tracker has 22 entries: 12 wrong, 7 right, 3 not on the ledger (optional attendee, cancelled meeting, meeting outside the window).\n\nWrite-back, 7 drafts (seed: no drafts, 2 sent messages from him):\n  charlotte.palmer@contoso.example: reply to AAMkD61867BD0A78844C3815861A41BA, naming Learning Time\n  diego.alvarez@contoso.example: reply to AAMkB7F3E1A92C6D58B0F4A7E3C9D261, naming OKR, Brainstorm\n  jack.henry@contoso.example: reply to AAMkDDFB4210A30B7656D7D0057D2820, naming OKR\n  jared.ellis@contoso.example: reply to AAMk2A7F5D19C3E84B6A7F5D19C3B84E, naming Vendor\n  jenna.white@contoso.example: reply to AAMk4E9B6C23F8A15D7E4B9C6F23A851, naming Roadmap, Escalation\n  nora.ford@contoso.example: reply to AAMk9E5B2D84A7F16C3E5B2D84A7C16F, naming Escalation\n  olivia.myers@contoso.example: reply to AAMkC1B1A49DD2E7AC344BA18643FFAD, naming Hiring\n\n=== DECOYS ===\n  UTC-bounded calendar search / UTC dates          -> Customer Escalation Sync missing (3 rows, Jenna's and Nora's drafts), Planning Offsite Prep in\n  conditional settlement read in UTC                -> Diego 6 May and Cameron roadmap OWES_ANSWER; tracker fix rows change\n  quoted yes taken as Jack Henry's answer          -> COMING on the vendor review; tracker fix lost\n  \"the 2pm one on Thursday\" not mapped             -> Jasmine OWES_ANSWER on the vendor review and a draft to her\n  email always overrides the invitation            -> Jasmine 2 May COMING,EMAIL\n  default 25-message page                           -> the late-April answers and Olivia's only email missing\n  cancelled / optional / display-name / duplicate   -> row count off\n  write-back: draft on a meeting thread instead of the latest email, a new message, a draft to someone who answered, sending\n\n=== SEED ===\nBuild-time seed environment/seed/seed_outlook_task.py adds 23 inbox messages for user 46 to Synthetic_db.db, marks OKR Planning and the\n6 May Weekly Pipeline Review as moved, sets UTC answer times on five meetings (and Jasmine Porter's decline of 2 May), inserts six\nmeetings he organised (one cancelled, one just outside the window, one just inside it), and fails the build on drift or collision.\n"

